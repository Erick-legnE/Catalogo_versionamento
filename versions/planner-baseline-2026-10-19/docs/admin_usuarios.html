<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brasil Botões • Administração de usuários</title>
<style>
:root{--blue:#00bad2;--ink:#405153;--bg:#f3fafa;--line:#dcebed}*{box-sizing:border-box}body{margin:0;font-family:'Nunito Sans',Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:#4d5759;color:#fff;border-bottom:3px solid var(--blue);padding:18px 25px;display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0}header a{color:white}main{max-width:1100px;margin:24px auto;padding:0 16px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:15px;box-shadow:0 2px 12px #00bad218}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.field{margin-bottom:12px}label{display:block;font-size:12px;font-weight:700;margin:0 0 4px}input,select{width:100%;padding:9px 11px;border:1px solid #cee2e5;border-radius:7px;background:white;color:#283b3e}button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:800;cursor:pointer}button:hover{filter:brightness(.93)}button:disabled{opacity:.55}.permissions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.permissions label{background:#f3fafb;border-radius:7px;padding:10px;display:flex;align-items:center;gap:8px}.permissions input{width:auto}small{color:#71858b}#status{min-height:22px;font-size:12px;font-weight:700}#status.error{color:#be123c}#status.ok{color:#15803d}@media(max-width:700px){.grid,.permissions{grid-template-columns:1fr}}</style></head>
<body><header><h1>Brasil Botões — Acessos</h1><a href="index.html">← Portal</a></header><main><div id="status">Carregando...</div>
<section class="grid"><div class="panel"><h2>Usuários existentes</h2><div class="field"><label>Buscar usuário</label><input id="query" placeholder="Nome, login, representante..." oninput="renderList()"></div><div class="field"><label>Selecionar conta</label><select id="users" size="12" onchange="pickUser()"></select></div></div>
<div class="panel"><h2 id="editing">Editar conta</h2><div class="field"><label>Nome</label><input id="nome"></div><div class="field"><label>Login</label><input id="username" disabled></div><div class="field"><label>Perfil</label><select id="role"><option value="representante">Representante</option><option value="cliente">Cliente</option><option value="funcionario">Funcionário</option><option value="admin">Administrador</option></select></div><div class="field"><label><input id="ativo" type="checkbox" style="width:auto"> Conta ativa</label></div><h3>Áreas autorizadas</h3><div id="perms" class="permissions"></div><div class="field" style="margin-top:13px"><label>Trocar senha (deixe vazio para manter)</label><input type="password" id="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres"></div><button onclick="saveUser()">Salvar permissões</button></div></section>
<section class="panel"><h2>Cadastrar funcionário / representante</h2><div class="grid"><div><div class="field"><label>Nome</label><input id="new-name"></div><div class="field"><label>Usuário</label><input id="new-username"></div></div><div><div class="field"><label>Senha inicial</label><input type="password" id="new-password" autocomplete="new-password"></div><div class="field"><label>Perfil</label><select id="new-role"><option value="funcionario">Funcionário</option><option value="representante">Representante</option><option value="cliente">Cliente</option><option value="admin">Administrador</option></select></div></div></div><button onclick="createUser()">Criar usuário</button><p><small>O acesso por área pode ser ajustado imediatamente após criar a conta.</small></p></section></main>
<script>
let users=[], csrf='', active=null;
const $=id=>document.getElementById(id), labels={catalogo:'Catálogo Geral',pastilhas:'Pastilhas',automacao:'Automação / Fichas',cores_preview:'Prévia de Cores',engenharia:'Engenharia / Facas',subsites:'Catálogos individuais',admin:'Gerenciar usuários'};
function notice(s,error=false){$('status').textContent=s;$('status').className=error?'error':'ok'}
async function api(path,method='GET',data){const res=await fetch(path,{method,headers:{...(method!=='GET'?{'Content-Type':'application/json','X-CSRF-Token':csrf}:{})},body:data?JSON.stringify(data):undefined});let j=await res.json();if(!res.ok)throw Error(j.detail||res.status);return j}
async function init(){try{const me=await api('/api/auth/me');csrf=me.csrf;if(!me.user.permissoes.includes('admin'))throw Error('Acesso negado');await loadUsers();notice('Permissões carregadas.')}catch(e){notice(e.message,true)}}
async function loadUsers(){const result=await api('/api/admin/usuarios');users=result.usuarios;renderList();if(active){const newActive=users.find(u=>u.id===active.id);if(newActive){active=newActive;renderUser()}}}
function renderList(){const v=$('query').value.toLowerCase();$('users').innerHTML='';users.filter(u=>(u.nome+' '+u.username+' '+u.role).toLowerCase().includes(v)).forEach(u=>{const option=document.createElement('option');option.value=u.id;option.textContent=`${u.nome} (${u.username}) · ${u.role}${u.ativo?'':' [inativo]'}`;$('users').appendChild(option)});if(active)$('users').value=active.id;}
function pickUser(){active=users.find(u=>u.id===$('users').value);renderUser()}
function renderUser(){if(!active)return;$('editing').textContent='Editar: '+active.nome;$('nome').value=active.nome;$('username').value=active.username;$('role').value=active.role;$('ativo').checked=active.ativo;$('password').value='';$('perms').replaceChildren();Object.entries(labels).forEach(([p,label])=>{const el=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.value=p;input.checked=active.permissoes.includes(p);el.append(input,document.createTextNode(' '+label));$('perms').append(el)});}
async function saveUser(){if(!active){notice('Selecione um usuário.',true);return}try{const data={action:'update',id:active.id,nome:$('nome').value,role:$('role').value,ativo:$('ativo').checked,permissoes:[...document.querySelectorAll('#perms input:checked')].map(e=>e.value)};if($('password').value)data.password=$('password').value;await api('/api/admin/usuarios','POST',data);await loadUsers();notice('Permissões salvas em usuarios.json.')}catch(e){notice(e.message,true)}}
async function createUser(){try{await api('/api/admin/usuarios','POST',{action:'create',nome:$('new-name').value,username:$('new-username').value,password:$('new-password').value,role:$('new-role').value});$('new-password').value='';await loadUsers();notice('Usuário criado em usuarios.json.')}catch(e){notice(e.message,true)}}
init();
</script></body></html>
