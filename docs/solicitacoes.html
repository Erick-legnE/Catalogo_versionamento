<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brasil Botões — Solicitações</title>
<style>
:root{--azul:#00bad2;--azul-d:#0099ad;--header:#4d5759;--texto:#4d5759;--muted:#718083;--fundo:#f4fbfc;--card:#fff;--borda:#d8f0f3;--verde:#6ebd4a;--laranja:#d97706;--vermelho:#dc2626;--sombra:0 3px 18px rgba(0,100,120,.10)}
[data-theme="dark"]{--header:#020617;--texto:#e2e8f0;--muted:#94a3b8;--fundo:#0f172a;--card:#1e293b;--borda:#334155;--sombra:0 6px 22px rgba(0,0,0,.25)}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:14px/1.45 Arial,sans-serif}.header{height:66px;background:var(--header);border-bottom:3px solid var(--azul);display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:#fff}.brand{color:#fff;text-decoration:none;font-weight:900;font-size:18px}.brand span{color:var(--azul)}.actions{display:flex;gap:8px}.button,.select{border:1px solid var(--borda);border-radius:8px;padding:9px 12px;background:var(--card);color:var(--texto);font-weight:800;cursor:pointer}.header .button{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}.button.primary{background:var(--azul);border-color:var(--azul);color:#fff}.button:hover{background:var(--azul-d);color:#fff}.page{max-width:1100px;margin:0 auto;padding:28px 20px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}.hero h1{margin:0;font-size:30px}.hero p{margin:6px 0 0;color:var(--muted)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.toolbar label{font-weight:800;color:var(--muted)}.notice{padding:12px 14px;border:1px solid var(--borda);border-radius:10px;background:var(--card);color:var(--muted);margin-bottom:16px}.notice.error{border-color:#fecaca;color:#991b1b;background:#fff1f2}.grid{display:grid;gap:14px}.request{background:var(--card);border:1px solid var(--borda);border-radius:12px;box-shadow:var(--sombra);padding:16px}.request-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.request h2{font-size:17px;margin:0 0 4px}.request-id{font:11px ui-monospace,Consolas,monospace;color:var(--muted);word-break:break-all}.badge{display:inline-flex;white-space:nowrap;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;background:#e0f2fe;color:#075985}.badge.approved,.badge.production_ready,.badge.rendered_3d{background:#dcfce7;color:#166534}.badge.rejected,.badge.render_error{background:#fee2e2;color:#991b1b}.badge.in_review,.badge.rendering_3d{background:#ffedd5;color:#9a3412}.details{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}.detail{border:1px solid var(--borda);border-radius:8px;padding:9px}.detail small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:900;margin-bottom:3px}.detail strong{display:block;word-break:break-word}.actions-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.history{margin-top:14px;border-top:1px solid var(--borda);padding-top:11px}.history summary{cursor:pointer;color:var(--muted);font-weight:800}.history ul{margin:9px 0 0;padding-left:20px;color:var(--muted);font-size:12px}.admin-box{display:grid;grid-template-columns:180px minmax(180px,1fr) auto;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--borda)}.empty{text-align:center;padding:35px 15px;color:var(--muted);background:var(--card);border:1px dashed var(--borda);border-radius:12px}@media(max-width:700px){.hero{display:block}.details{grid-template-columns:1fr 1fr}.admin-box{grid-template-columns:1fr}.request-head{display:block}.badge{margin-top:10px}}
</style>
</head>
<body>
<header class="header"><a class="brand" href="index.html">Brasil <span>Botões</span> — Solicitações</a><div class="actions"><a class="button" href="automacao.html">Nova solicitação</a><button class="button" id="theme-button" type="button">Tema</button></div></header>
<main class="page">
<section class="hero"><div><h1>Solicitações</h1><p>Acompanhe fichas geradas, revisões e os próximos resultados do fluxo.</p></div></section>
<div class="toolbar"><label for="status-filter">Filtrar:</label><select id="status-filter" class="select"><option value="">Todas</option><option value="pdf_ready">PDF pronto</option><option value="in_review">Em revisão</option><option value="approved">Aprovada</option><option value="rejected">Rejeitada</option><option value="production_ready">Pronta para produção</option><option value="rendering_3d">Renderizando 3D</option><option value="rendered_3d">3D pronto</option><option value="render_error">Erro no 3D</option></select><button class="button" id="reload-button" type="button">Atualizar</button></div>
<div id="notice" class="notice">Carregando solicitações...</div>
<section id="request-grid" class="grid" aria-live="polite"></section>
</main>
<script>
const $=id=>document.getElementById(id);
const labels={pdf_ready:'PDF pronto',in_review:'Em revisão',approved:'Aprovada',rejected:'Rejeitada',production_ready:'Pronta para produção',rendering_3d:'Renderizando 3D',rendered_3d:'3D pronto',render_error:'Erro no 3D'};
const statuses=Object.keys(labels);
let session=null,items=[];
function formatDate(value){try{return new Date(value).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}catch{return String(value||'')}}
function text(value){return String(value??'').trim()}
function add(parent,tag,value='',className=''){const node=document.createElement(tag);if(value)node.textContent=value;if(className)node.className=className;parent.appendChild(node);return node}
function itemTitle(item){const data=item.metadata||{},base=data.item||{};if(base.type==='button')return `Ref. ${text(base.reference)||'—'} · TAM ${text(base.size_tam)||'—'} · ${text(base.color)||'—'}`;return text(base.description)||'Outro item'}
function itemDetails(item){const data=item.metadata||{},base=data.item||{},ficha=data.ficha||{};return [['Cliente',ficha.cliente],['Representante',ficha.representante],['Código',base.codigo_personalizado||'AUTO']].filter(row=>text(row[1]))}
function statusBadge(status){return add(document.createDocumentFragment(),'span',labels[status]||status||'Sem status',`badge ${status||''}`)}
function render(){const grid=$('request-grid');grid.replaceChildren();if(!items.length){add(grid,'div','Nenhuma solicitação encontrada.','empty');return}for(const item of items){const card=add(grid,'article','','request');const head=add(card,'div','','request-head');const title=add(head,'div');add(title,'h2',itemTitle(item));add(title,'div',item.id,'request-id');head.appendChild(statusBadge(item.status));const details=add(card,'div','','details');for(const [label,value] of itemDetails(item)){const cell=add(details,'div','','detail');add(cell,'small',label);add(cell,'strong',text(value))}const actions=add(card,'div','','actions-row');if(item.pdf_url){const pdf=add(actions,'a','Abrir PDF','button primary');pdf.href=item.pdf_url;pdf.target='_blank';pdf.rel='noopener'}const blender=item.pipeline?.blender;if(blender?.status==='ready'){const blend=add(actions,'a','Abrir .blend','button');blend.href=blender.blend_url;blend.target='_blank';blend.rel='noopener';const preview=add(actions,'a','Ver prévia 3D','button');preview.href=blender.preview_url;preview.target='_blank';preview.rel='noopener'}const date=add(actions,'span',`Atualizada em ${formatDate(item.updated_at||item.created_at)}`);date.style.color='var(--muted)';date.style.fontSize='12px';const history=Array.isArray(item.history)?item.history:[];if(history.length){const box=add(card,'details','','history');add(box,'summary',`Histórico (${history.length})`);const list=add(box,'ul');for(const entry of history.slice().reverse()){const note=text(entry.note)||'Status atualizado';add(list,'li',`${formatDate(entry.at)} — ${labels[entry.status]||entry.status}: ${note}`)}}if(session?.user?.permissoes?.includes('admin'))renderAdmin(card,item)} }
function renderAdmin(card,item){const box=add(card,'div','','admin-box');const select=add(box,'select','','select');for(const value of statuses){const option=add(select,'option',labels[value]);option.value=value;option.selected=value===item.status}const note=document.createElement('input');note.className='select';note.placeholder='Observação opcional';box.appendChild(note);const button=add(box,'button','Salvar status','button primary');button.type='button';button.addEventListener('click',async()=>{button.disabled=true;try{const response=await fetch(`/api/solicitacoes/${encodeURIComponent(item.id)}`,{method:'PATCH',headers:{'Content-Type':'application/json','X-CSRF-Token':session.csrf},body:JSON.stringify({status:select.value,note:note.value})});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.detail||`HTTP ${response.status}`);await load()}catch(error){showError(error.message)}finally{button.disabled=false}});if(['pdf_ready','approved','production_ready','render_error','rendered_3d'].includes(item.status)){const renderButton=add(box,'button',item.status==='rendered_3d'?'Gerar 3D novamente':'Gerar 3D','button');renderButton.type='button';renderButton.addEventListener('click',async()=>{renderButton.disabled=true;try{const response=await fetch(`/api/solicitacoes/${encodeURIComponent(item.id)}/render`,{method:'POST',headers:{'X-CSRF-Token':session.csrf}});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.detail||`HTTP ${response.status}`);await load()}catch(error){showError(error.message)}finally{renderButton.disabled=false}})}}
function showError(message){const notice=$('notice');notice.className='notice error';notice.textContent=message}
async function loadSession(){const response=await fetch('/api/auth/me',{cache:'no-store'});if(!response.ok){location.href='/index.html?next=/solicitacoes.html';throw new Error('Login necessário.')}session=await response.json()}
async function load(){const notice=$('notice');notice.className='notice';notice.textContent='Carregando solicitações...';try{const selected=$('status-filter').value;const query=selected?`?limit=100&status=${encodeURIComponent(selected)}`:'?limit=100';const response=await fetch('/api/solicitacoes'+query,{cache:'no-store'});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.detail||`HTTP ${response.status}`);items=Array.isArray(result.items)?result.items:[];notice.textContent=`${result.total||0} solicitação(ões) encontrada(s).`;render()}catch(error){showError(error.message)}}
function applyTheme(){const dark=localStorage.getItem('theme')==='dark';if(dark)document.documentElement.setAttribute('data-theme','dark');$('theme-button').textContent=dark?'Tema claro':'Tema escuro'}
$('theme-button').addEventListener('click',()=>{const dark=document.documentElement.getAttribute('data-theme')==='dark';if(dark){document.documentElement.removeAttribute('data-theme');localStorage.setItem('theme','light')}else{document.documentElement.setAttribute('data-theme','dark');localStorage.setItem('theme','dark')}applyTheme()});$('reload-button').addEventListener('click',load);$('status-filter').addEventListener('change',load);applyTheme();loadSession().then(load).catch(()=>{});
</script>
</body>
</html>
